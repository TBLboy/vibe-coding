- id: TASK-003
  title: 配置全局 Vibe Python 解释器并绑定 Hooks
  kind: task
  phase: implementation
  goal: 让安装器在缺少全局配置时自动创建或修复 Conda/Miniforge/Miniconda 的 vibe-coding Python 3.11 环境，并让所有跨项目 Vibe Python 功能使用它。
  status: done
  authority: A
  owner: agent
  related_business_logic: []
  depends_on:
  - TASK-002
  inputs:
  - 用户的 Miniforge 环境 vibe-coding
  - global_installer.py
  - Codex config.toml
  - 全局 Agent 提示词
  outputs:
  - CODEX_HOME/vibe-python 全局配置
  - 绑定到配置解释器的 Hooks
  - 自动 bootstrap/修复脚本
  - 安装器和文档支持
  done_when:
  - 安装器优先读取 CODEX_HOME/vibe-python 或 VIBE_PYTHON
  - 配置缺失时自动寻找 Conda/Miniforge/Miniconda 并创建 vibe-coding Python 3.11 环境
  - 自动安装 runtime/scripts/requirements.txt
  - 全局 Hooks 使用配置解释器，新项目无需单独设置
  - 安装器验证和测试通过
  verification:
    status: passed
    commands:
    - /home/tbl/Project/vibe-coding/install.sh or update.sh bootstrap_vibe_python.py
    - /home/tbl/miniforge3/envs/vibe-coding/bin/python runtime/scripts/validate_package.py --root .
    - /home/tbl/miniforge3/envs/vibe-coding/bin/python -m unittest discover -s tests -p test_*.py -q
    - /home/tbl/miniforge3/envs/vibe-coding/bin/python scripts/global_installer.py verify --codex-home /home/tbl/.codex --without-mcp
    - fresh project init/validate/restore and SessionStart/PreCompact hook smoke test
    evidence:
    - PYTHON-001
    - PYTHON-002
    - PYTHON-003
    - PYTHON-004
    limitations:
    - PostToolUse 未单独执行真实写入工具回调；其脚本已包含在安装包测试和配置注册中。
  result:
    summary: 新增用户级 CODEX_HOME/vibe-python 与 VIBE_PYTHON 临时覆盖；安装/升级包装脚本会自动创建或修复 Conda 环境 vibe-coding、安装 runtime 依赖，并将全局 Hooks
