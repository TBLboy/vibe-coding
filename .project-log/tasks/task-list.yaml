version: "0.2"
active_goal: null
tasks:
  - id: TASK-001
    title: Audit installed Vibe Coding Codex framework
    kind: task
    phase: verification
    goal: Verify the installed Vibe Coding Codex Global Core framework
    status: done
    authority: A
    owner: agent
    related_business_logic: []
    depends_on: []
    inputs:
      - installed Codex configuration
      - Vibe Workflow runtime
      - release package
      - test suite
    outputs:
      - audit evidence
      - non-blocking environment issue list
    done_when:
      - installer, package validation, and unit tests pass
      - Project Log, Loop Core, Hooks, Goal, and role rendering pass
      - host issues are separated from framework issues
    verification:
      status: passed
      commands:
        - py -3 scripts/global_installer.py verify
        - py -3 -m unittest discover -s tests -p test_*.py
        - py -3 scripts/validate_project.py --root .
        - py -3 scripts/validate_workflow.py --root .
      evidence:
        - AUDIT-001
        - AUDIT-002
        - AUDIT-003
        - AUDIT-004
        - AUDIT-005
        - AUDIT-006
        - AUDIT-007
        - AUDIT-008
      limitations:
        - codex doctor reports a host npm/Zed package-path mismatch
        - MCP was intentionally not installed
  - id: TASK-002
    title: Expand Codex Skill routing and keep repository source-only
    kind: task
    phase: implementation
    goal: Make high-value installed Skills discoverable through the global Agent route table and stop tracking release archives
    status: done
    authority: A
    owner: agent
    related_business_logic: []
    depends_on:
      - TASK-001
    inputs:
      - prompts/vibe-global-agent.md
      - skills directory
      - existing release archives
    outputs:
      - expanded Skill route table
      - source-only Git repository configuration
    done_when:
      - orchestration, research, context, workflow-maintenance, extraction, Skill-authoring, plan-stress-test, and UX-audit routes are explicit
      - every newly routed Skill has a local SKILL.md
      - release archives are removed from Git tracking and ignored
      - package validation and the standard-library test suite pass
    verification:
      status: passed
      commands:
        - py -3 runtime/scripts/validate_package.py --root .
        - py -3 -m unittest discover -s tests -v
      evidence:
        - ROUTE-001
        - ROUTE-002
        - ROUTE-003
      limitations:
        - pytest is not installed in the current Python environment; unittest execution passed
    result:
      summary: Added nine explicit Skill routes, removed tracked ZIP artifacts, and added ZIP ignore rules
      changed_files:
        - prompts/vibe-global-agent.md
        - .gitignore
        - .project-log/tasks/task-list.yaml
        - .project-log/current-session.md
      deviations: []
      follow_ups:
        - Push the source-only change to origin/main through 127.0.0.1:10808
