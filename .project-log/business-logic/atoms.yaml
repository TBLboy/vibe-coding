atoms:
- id: BL-WFOPT-001
  title: 恢复状态准确反映可执行性
  kind: state-transition
  domain: workflow-optimization
  status: active
  authority: evidence-derived
  source:
    type: document
    reference: .project-log/docs/workflow-optimization-technical-selection.md
  description: 四项目标的验收细化草案；TASK-014 冻结，不能视为所有边界语义已获批准。
  trigger: 选择或恢复任务时
  rule:
    statement: Goal、Task、Run、阻塞事实和下一步不得互相矛盾；未绑定目标不能借用历史目标。
  acceptance:
  - id: AC-WFOPT-001
    given: 任务等待 Q-021 且另有独立任务
    when: 恢复执行上下文
    then: 显示等待事项及独立可执行工作，不把被阻塞任务显示为可执行
    method: runtime/scripts/loop_state.py + tests/test_loop_core.py + docs/workflow-optimization-cross-platform-acceptance.md
    evidence: RUNBIND-028
    status: passed
  decision_refs:
  - DEC-006
  notes: 用户已授权实施，具体契约见 specs/workflow-optimization-contract.md；真实迁移仍单独授权。
- id: BL-WFOPT-002
  title: 一次业务操作维护一致状态和可重建摘要
  kind: flow
  domain: workflow-optimization
  status: active
  authority: evidence-derived
  source:
    type: document
    reference: .project-log/docs/workflow-optimization-technical-selection.md
  description: 四项目标的验收细化草案；TASK-014 冻结，不能视为所有边界语义已获批准。
  trigger: 开始、阻塞或完成任务时
  rule:
    statement: 同一业务操作的权威状态一致提交，摘要可重建，重复请求不重复记账。
  acceptance:
  - id: AC-WFOPT-002
    given: 完成请求重试且摘要生成中断
    when: 重新提交相同请求
    then: 只保留一次业务结果，摘要可恢复，跨对象状态一致
    method: runtime/scripts/state_store.py + runtime/scripts/state_context.py + test_state_service.py
    evidence: STATE020-SLICE
    status: passed
  decision_refs:
  - DEC-006
  notes: 用户已授权实施，具体契约见 specs/workflow-optimization-contract.md；真实迁移仍单独授权。
- id: BL-WFOPT-003
  title: 控制成本随任务风险分级
  kind: rule
  domain: workflow-optimization
  status: active
  authority: evidence-derived
  source:
    type: document
    reference: .project-log/docs/workflow-optimization-technical-selection.md
  description: 四项目标的验收细化草案；TASK-014 冻结，不能视为所有边界语义已获批准。
  trigger: 收到新用户请求时
  rule:
    statement: 先读取最小必要约束再分流，低风险任务不得默认承担完整生命周期，关键风险不得静默降级。
  acceptance:
  - id: AC-WFOPT-003
    given: 意图明确且无关键语义影响的小改动
    when: 选择执行路径
    then: 采用轻量记录和相关验证，不创建无关架构或决策记录
    method: runtime/scripts/state_routing.py + test_state_routing.py
    evidence: ROUTING-021
    status: passed
  decision_refs:
  - DEC-006
  notes: 用户已授权实施，具体契约见 specs/workflow-optimization-contract.md；真实迁移仍单独授权。
- id: BL-WFOPT-004
  title: 证据区分历史结果与当前版本适用性
  kind: data-contract
  domain: workflow-optimization
  status: active
  authority: evidence-derived
  source:
    type: document
    reference: .project-log/docs/workflow-optimization-technical-selection.md
  description: 四项目标的验收细化草案；TASK-014 冻结，不能视为所有边界语义已获批准。
  trigger: 登记、引用证据或判断完成时
  rule:
    statement: 历史结果保留，当前适用性按明确输入和版本策略判断；无法确认时不作为当前完成依据。
  acceptance:
  - id: AC-WFOPT-004
    given: 历史 PDF 已变化而数据计算输入未变
    when: 核查相关证据
    then: 旧 PDF 验证不背书当前产物，无关计算证据不因路径重叠被误伤
    method: runtime/scripts/state_evidence.py + runtime/scripts/state_gate.py + runtime/scripts/loop_state.py + test_state_evidence.py + test_state_gate.py + tests/test_loop_core.py
    evidence: HOOKINVALIDATE-029
    status: passed
  decision_refs:
  - DEC-006
  notes: 用户已授权实施，具体契约见 specs/workflow-optimization-contract.md；真实迁移仍单独授权。
- id: BL-PROJECTINIT-001
  title: .project-log 走现有创建链路且不覆盖已有内容
  kind: rule
  domain: project-init
  status: active
  priority: high
  risk: low
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-08-15 项目初始化 skill 澄清（用户确认不动 init_project.py 链路）
  description: 初始化项目时 .project-log 的创建必须复用现有 init_project.py 链路，已存在则不覆盖。
  actors:
  - user
  - agent
  trigger: 用户要求初始化项目（初始化项目/项目初始化/初始化该项目）
  preconditions:
  - 目标项目根目录已确认
  inputs:
  - 目标项目根目录
  rule:
    statement: 调用现有 init_project.py 创建 .project-log；已存在时跳过并报告，不覆盖。
  outputs:
  - .project-log 模板目录树
  side_effects: []
  exceptions:
  - project-log-template 缺失时初始化失败并停止
  failure_handling:
  - 报告错误，不继续写入 AGENTS.md
  invariants:
  - 不修改 init_project.py 及 project-log-template 内容
  acceptance:
  - id: AC-PI-001
    given: 目标目录无 .project-log
    when: 执行项目初始化
    then: 创建完整 .project-log 模板
    method: null
    evidence: null
    status: not-verified
  - id: AC-PI-002
    given: 目标目录已有 .project-log
    when: 再次执行项目初始化
    then: 跳过创建并报告 skipped，原内容不变
    method: null
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs: []
  decision_refs:
  - DEC-004
  implementation_refs:
  - skills/a-project-init/scripts/init_project_agents.py
  test_refs:
  - tests/test_project_init.py
  supersedes: []
  notes: null
  created_at: '2026-08-15T10:20:00+08:00'
  updated_at: null
  last_verified_at: null
- id: BL-PROJECTLOG-001
  title: 长 Markdown 摘要遵守最新在最上、头部快照、超限归档、单一事实源
  kind: rule
  domain: project-log
  status: active
  priority: high
  risk: low
  authority: user-confirmed
  source:
    type: user-statement
    reference: boss_electrics/.project-log/docs/log-file-organization-task.md（用户确认只优化 vibe-coding 框架源码）
  description: current-session.md 与 progress.md 是面向人的长摘要；最新内容在最上，顶部维护稳定的当前状态快照，超限时旧段落归档到 docs/archive/，精确下一步以 loop 状态文件为单一事实源。
  actors:
  - user
  - agent
  trigger: 初始化项目日志、更新 current-session.md/progress.md 或将长文档归档
  preconditions:
  - .project-log 已初始化
  inputs:
  - current-session.md
  - progress.md
  - loop/active-run.yaml
  - loop/handoff.md
  rule:
    statement: current-session.md 最新会话区块在顶部、progress.md 按日期倒序；两部文档顶部“当前状态”区块每次覆盖更新；文件超过约 50-100 KB 或会话区块约 10 条时，旧段落移动到 .project-log/docs/archive/；精确状态和下一步以 loop/active-run.yaml、loop/handoff.md 为准；机器维护的结构化状态文件不手工重排。
  outputs:
  - 可快速恢复的 current-session.md/progress.md
  - 可检索的 .project-log/docs/archive/ 归档文件
  side_effects: []
  exceptions:
  - 机器维护文件异常需要修复时，按运行时提供的方式处理
  failure_handling:
  - 归档时先校验引用完整性，不删除任何已记录事实
  invariants:
  - 不手工重排 loop/events.jsonl、loop/active-run.yaml、loop/handoff.md、verification/evidence.yaml
  acceptance:
  - id: AC-PROJECTLOG-001
    given: 新项目初始化
    when: 查看 current-session.md/progress.md
    then: 顶部存在“当前状态”快照，且文档写明最新在最上与归档约定
    method: tests/test_project_templates.py
    evidence: DOC-CONV-001
    status: not-verified
  dependencies: []
  baseline_refs: []
  decision_refs:
  - DEC-005
  implementation_refs:
  - runtime/project-log-template/current-session.md
  - runtime/project-log-template/progress.md
  - skills/a-project-log/SKILL.md
  - skills/a-project-log/REFERENCE.md
  - skills/a-session-handoff/SKILL.md
  test_refs:
  - tests/test_project_templates.py
  supersedes: []
  notes: null
  created_at: '2026-08-20T17:45:00+08:00'
  updated_at: null
  last_verified_at: null
- id: BL-PROJECTINIT-002
  title: 新建 AGENTS.md 时生成通用规则区与项目级规则区
  kind: rule
  domain: project-init
  status: active
  priority: high
  risk: medium
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-08-15 项目初始化 skill 澄清（模板 6 条与 README 提取规则确认）
  description: 目标目录无 AGENTS.md 时，生成文件：先写通用开发规则区块（标记包裹），再写项目级规则区。
  actors:
  - user
  - agent
  trigger: 项目初始化且目标目录无 AGENTS.md
  preconditions:
  - 通用规则模板存在于 skill 内部
  inputs:
  - 项目级规则文本（可空）
  rule:
    statement: AGENTS.md = 通用规则区块（VIBE-PROJECT-GENERAL 标记包裹） + 项目级规则区；项目级规则来自 README/docs 凝炼，无则写入占位提示。
  outputs:
  - 根目录 AGENTS.md
  side_effects: []
  exceptions:
  - README/docs 不存在或不足以提炼项目规则
  failure_handling:
  - 项目级区保留占位提示，并向用户说明可手动补充
  invariants:
  - 通用规则模板内容原样注入，不裁剪
  acceptance:
  - id: AC-PI-003
    given: 目标目录无 AGENTS.md 且有 README 提炼出的项目规则
    when: 执行项目初始化
    then: 生成含通用区块与项目级规则的 AGENTS.md
    method: null
    evidence: null
    status: not-verified
  - id: AC-PI-004
    given: 目标目录无 AGENTS.md 且无 README/docs
    when: 执行项目初始化
    then: 项目级区写入占位提示
    method: null
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs: []
  decision_refs:
  - DEC-004
  implementation_refs:
  - skills/a-project-init/templates/general-rules.md
  - skills/a-project-init/scripts/init_project_agents.py
  test_refs:
  - tests/test_project_init.py
  supersedes: []
  notes: null
  created_at: '2026-08-15T10:20:00+08:00'
  updated_at: null
  last_verified_at: null
- id: BL-PROJECTINIT-003
  title: 已有 AGENTS.md 时只安全注入通用规则且幂等
  kind: rule
  domain: project-init
  status: active
  priority: high
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-08-15 项目初始化 skill 澄清（原内容视为项目级规则，只注入通用区）
  description: 目标目录已有 AGENTS.md 时，原内容一字不动保留（视为项目级规则），仅在文件最前注入通用规则区块；检测到标记则跳过。
  actors:
  - user
  - agent
  trigger: 项目初始化且目标目录已有 AGENTS.md
  preconditions:
  - AGENTS.md 可读
  inputs:
  - 现有 AGENTS.md 内容
  rule:
    statement: 若文件中无 VIBE-PROJECT-GENERAL:BEGIN 标记，则在最前注入通用区块并保留原内容；已有标记则跳过，不重复注入。
  outputs:
  - 更新后的 AGENTS.md
  side_effects: []
  exceptions:
  - 文件编码不可读
  failure_handling:
  - 报告错误，不修改文件
  invariants:
  - 原 AGENTS.md 内容不被删除或改写
  - 重复初始化不叠加通用区块
  acceptance:
  - id: AC-PI-005
    given: 已有无标记的 AGENTS.md
    when: 执行项目初始化
    then: 通用区块注入到最前，原内容完整保留
    method: null
    evidence: null
    status: not-verified
  - id: AC-PI-006
    given: AGENTS.md 已含通用标记
    when: 再次执行项目初始化
    then: 跳过注入，文件内容不变
    method: null
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs: []
  decision_refs:
  - DEC-004
  implementation_refs:
  - skills/a-project-init/scripts/init_project_agents.py
  test_refs:
  - tests/test_project_init.py
  supersedes: []
  notes: null
  created_at: '2026-08-15T10:20:00+08:00'
  updated_at: null
  last_verified_at: null
- id: BL-PROJECTINIT-004
  title: 通用开发规则模板以 skill 内部文件为唯一来源
  kind: rule
  domain: project-init
  status: active
  priority: medium
  risk: low
