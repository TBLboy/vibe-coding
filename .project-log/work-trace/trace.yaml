- id: TRACE-004
  task_id: TASK-003
  timestamp: '2026-07-27T10:17:25+08:00'
  context: 用户进一步要求安装器自己创建 Miniforge/Miniconda 风格的 vibe-coding 环境，并让后续全局依赖固定使用该环境。
  hypothesis: 安装包装脚本先运行无第三方依赖 bootstrap，再调用已准备好的 Python 安装器，可以覆盖新机器和新项目而不依赖系统 python
    版本。
  decision_ref: null
  action: 新增 bootstrap_vibe_python.py；install/update/uninstall 包装脚本调用它；bootstrap 查找现有
    Conda、创建/修复 vibe-coding、安装 PyYAML/jsonschema、写入 CODEX_HOME/vibe-python。
  expected_result: 缺少配置时自动准备环境；真实更新后 Hooks 和 verify 使用该环境。
  observation: 模拟缺失环境测试通过；真实 update.sh 完成全局更新；三个 Hooks 均绑定 vibe-coding Python；包校验与
    19 个 unittest 通过。
  actual_result: 安装路径已具备自动创建/修复环境能力；没有 Conda 时明确失败，不自动下载 Miniforge。
  delta: 从“要求用户先创建环境”改为“安装脚本在已有 Conda 管理器下自动创建环境”。
  lesson: 引导式安装应在进入需要 tomllib 的安装器前完成 Python bootstrap；否则系统 Python 3.10 会在导入阶段失败。
  next_adjustment: 若需要零前置依赖安装，还需另行设计并经用户确认 Miniforge 下载、校验和安装策略。
