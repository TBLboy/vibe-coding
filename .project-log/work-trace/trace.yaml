- id: TRACE-20260803-HOSTCFG-001
  context: 用户发现 cc-switch 配置示例仍使用 Windows 路径，而当前宿主机为 Ubuntu，并要求改为按宿主实际配置生成后记录并推送。
  hypothesis: 安装器已有正确的 CODEX_HOME/Vibe Python/源码根路径解析；将同一事实来源封装成生成脚本，可以消除手工模板跨机器复制造成的路径漂移。
  decision_ref: DEC-003
  action: 新增 scripts/generate_cc_switch_config.py，读取 CODEX_HOME、VIBE_PYTHON 或 CODEX_HOME/vibe-python 和当前源码根；更新 canonical 配置为当前 Ubuntu 生成结果。
  expected_result: 当前宿主机可直接粘贴生成结果，更换宿主机时重新运行脚本即可。
  observation: 当前宿主为 /home/tbl，CODEX_HOME=/home/tbl/.codex，Vibe Python=/home/tbl/miniforge3/envs/vibe-coding/bin/python，源码根=/home/tbl/Project/vibe-coding；生成一致性、TOML、路径扫描、安装器测试和包校验均通过。
  actual_result: implemented-unverified
  delta: 从静态 Windows 配置模板改为宿主机动态生成；canonical 文件不再包含 D:/conda、C:/Users 或 D:/Project。
  lesson: 路径相关配置必须由目标宿主机生成，仓库只能提供生成机制和当前宿主的示例，不能把某台机器的绝对路径当作通用值。
  next_adjustment: 提交并推送变更；用户在其他宿主机运行生成脚本后再粘贴到 cc-switch。
  evidence:
  - HOSTCFG-001

- id: TRACE-20260803-HOOK-SESSION-001
  context: 用户反馈 MCP 正常但每次新对话提示 SessionStart Hook 返回无效 JSON。
  hypothesis: Hook 使用旧式顶层 additionalContext，当前 Codex 需要 hookSpecificOutput 并声明 hookEventName。
  decision_ref: null
  action: 检查 Codex Hook 源码调用链和本机实际输出；修复 SessionStart/PreCompact 输出结构；补充严格回归测试；更新本机受管 Hook。
  expected_result: 新会话能接受 SessionStart 输出并注入 additionalContext，不再报告 invalid session start JSON output。
  observation: 修复前输出 JSON 合法但缺少 hookSpecificOutput；修复后输出事件专用结构，源码与安装文件哈希一致；Codex ephemeral 返回 OK。
  actual_result: passed
  delta: 从顶层 additionalContext 迁移为 hookSpecificOutput.hookEventName + additionalContext。
  lesson: Hook 的 JSON 语法合法不等于事件协议合法，必须同时验证事件专用字段和真实宿主调用结果。
  next_adjustment: 用户重启/新建交互式 Codex 对话观察 TUI 提示；确认后提交推送。
  evidence:
  - HOOK-SESSION-001
