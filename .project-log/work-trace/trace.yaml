  context: 用户要求将 Vibe Coding 涉及 Python 的部分改为跨项目全局使用 Miniforge vibe-coding 环境。
  hypothesis: 用户级解释器配置文件加上安装器生成的绝对路径 Hook，可以消除新项目继承系统 python3 的版本漂移。
  decision_ref: null
  action: 新增 CODEX_HOME/vibe-python 与 VIBE_PYTHON 解析；修改安装器、Linux wrappers、全局 Agent
    提示词和文档；更新全局安装。
  expected_result: 所有新项目的 Vibe Hooks 与 Project Log 工具使用 Python 3.11.15。
  observation: 全局 config.toml 三个 Hook 均绑定 /home/tbl/miniforge3/envs/vibe-coding/bin/python3.11；包校验、18
    个 unittest、安装 verify、新项目 smoke test 均通过。
  actual_result: 全局 Vibe Python 配置生效；项目数据不受影响。
  delta: 新增用户级 /home/tbl/.codex/vibe-python；更新全局 managed AGENTS/config/runtime/Skills。
  lesson: 跨项目控制层配置应放在 CODEX_HOME，而不是每个项目的 .project-log；项目自身应用环境仍需独立管理。
  next_adjustment: 重启 Codex 会话，使新的 Hook 命令在新会话中加载。
