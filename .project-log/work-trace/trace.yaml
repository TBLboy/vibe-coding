  context: 用户确认采用 CodeGraph，并要求将 MCP 设计为 Vibe Coding 的可选安装项。
  hypothesis: 将可选 MCP 做成源码 catalog、安装器选择参数和可验证状态，可以同时支持当前 CodeGraph 和未来 MCP，而不强制污染核心安装。
  decision_ref: DEC-001
  action: 新增 runtime/mcp/optional-mcps.json；扩展 global_installer.py 的 --mcp、状态、验证、卸载和冲突保护；补充 validator、测试、文档；构建 0.4.1 并更新全局
    Codex。
  expected_result: 新安装默认核心-only；选择 codegraph 后 Codex MCP enabled；CodeGraph 索引保持 up to date。
  observation: 包校验、21 个 unittest、release/plugin validation、全局 verify、codex mcp list/get 和 codegraph status 均通过；隔离真实 Codex
    安装/卸载与 --without-mcp 保留测试通过。
  actual_result: Vibe Coding 0.4.1 已安装；state.optional_mcps=[codegraph]；CodeGraph 1.5.0 enabled；LeRobot 索引 804 files / 17,512
    nodes / 46,134 edges。
  delta: 相对 TASK-003，新增可选 MCP 生命周期和当前 CodeGraph 实例；未把 CodeGraph 安装进 /home/tbl/miniforge3/envs/lerobot。
  lesson: MCP 配置必须与应用 Python 环境分离，并记录 catalog、选择状态、所有权和验证证据。
  next_adjustment: 重启 Codex 或 Zed ACP Thread，确认新会话实际暴露 CodeGraph MCP tools。
