  - 验证缓存、MCP initialize、Codex exec 和 SessionStart Hook
  observation: 缓存配置正确；initialize 返回 Document Loader 3.4.5；Codex exec 返回 OK；Hook 返回 additionalContext；active codex 仍为 Zed cache 0.145.0，Roaming npm 为 0.146.0
  result: passed
