atoms:
- id: BL-WFOPT-001
  title: 恢复状态准确反映可执行性
  kind: state-transition
  domain: workflow-optimization
  status: active
  authority: evidence-derived
  source:
    type: document
    reference: .project-log/docs/workflow-optimization-technical-selection.md
  description: 四项目标的验收细化草案；TASK-014 冻结，不能视为所有边界语义已获批准。
  trigger: 选择或恢复任务时
  rule:
    statement: Goal、Task、Run、阻塞事实和下一步不得互相矛盾；未绑定目标不能借用历史目标。
  acceptance:
  - id: AC-WFOPT-001
    given: 任务等待 Q-021 且另有独立任务
    when: 恢复执行上下文
    then: 显示等待事项及独立可执行工作，不把被阻塞任务显示为可执行
    method: runtime/scripts/loop_state.py + tests/test_loop_core.py + docs/workflow-optimization-cross-platform-acceptance.md
    evidence: RUNBIND-028
    status: passed
  decision_refs:
  - DEC-006
  notes: 用户已授权实施，具体契约见 specs/workflow-optimization-contract.md；真实迁移仍单独授权。
- id: BL-WFOPT-002
