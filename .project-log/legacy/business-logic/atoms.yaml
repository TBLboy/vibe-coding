- id: BL-FRAMELAND-008
  title: 长正文留在 Git 与 Markdown，结构化存储只保存状态与版本引用
  kind: data-contract
  domain: framework-landing
  status: active
  priority: medium
  risk: medium
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-09-21 用户确认整体改造方案（结构化状态与长文档分工包含在方案内）
  description: 需求书、架构说明、研究、复核报告等长正文继续以 Git 管理的 Markdown 保存；结构化存储保存其状态、关系与版本引用，避免同一事实出现两份可独立漂移的正文。
  actors:
  - agent
  - runtime
  trigger: 记录长文档类产物或判断其是否仍然有效时
  preconditions:
  - 项目已声明 format 2
  inputs:
  - 长文档产物
  rule:
    statement: 长正文以 Git/Markdown 为唯一正文来源；结构化存储只保存标识、关系与版本引用，正文变化通过版本引用使相关证据失效，而不是复制一份正文进数据库。
  outputs:
  - 可追溯的文档版本引用
  side_effects: []
  exceptions:
  - 状态类短字段（如标题、状态、时间）仍可结构化保存
  failure_handling:
  - 引用缺失或被改动时标记为失效并说明原因
  invariants:
  - 不把长文档正文同时存进结构化存储作为第二事实源
  acceptance:
  - id: AC-FL-016
    given: 一份被引用的长文档
    when: 该文档内容发生变化
    then: 结构化存储中的引用版本可判定变化并使相关证据失效
    method: null
    evidence: null
    status: not-verified
  - id: AC-FL-017
    given: 同一份长文档
    when: 检查结构化存储内容
    then: 只存在引用与元数据，不存在可独立漂移的正文副本
    method: null
    evidence: null
    status: not-verified
  dependencies:
