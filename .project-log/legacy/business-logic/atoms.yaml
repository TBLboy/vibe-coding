- id: BL-WFOPT-003
  title: 控制成本随任务风险分级
  kind: rule
  domain: workflow-optimization
  status: active
  authority: evidence-derived
  source:
    type: document
    reference: .project-log/docs/workflow-optimization-technical-selection.md
  description: 四项目标的验收细化草案；TASK-014 冻结，不能视为所有边界语义已获批准。
  trigger: 收到新用户请求时
  rule:
