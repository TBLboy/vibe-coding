- id: BL-PROJECTINIT-001
  title: .project-log 走现有创建链路且不覆盖已有内容
  kind: rule
  domain: project-init
  status: deprecated
  priority: high
  risk: low
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-08-15 项目初始化 skill 澄清（用户确认不动 init_project.py 链路）
  description: 初始化项目时 .project-log 的创建必须复用现有 init_project.py 链路，已存在则不覆盖。
  actors:
  - user
  - agent
  trigger: 用户要求初始化项目（初始化项目/项目初始化/初始化该项目）
  preconditions:
  - 目标项目根目录已确认
  inputs:
  - 目标项目根目录
  rule:
    statement: 调用现有 init_project.py 创建 .project-log；已存在时跳过并报告，不覆盖。
  outputs:
  - .project-log 模板目录树
  side_effects: []
  exceptions:
  - project-log-template 缺失时初始化失败并停止
  failure_handling:
  - 报告错误，不继续写入 AGENTS.md
  invariants:
  - 不修改 init_project.py 及 project-log-template 内容
  acceptance:
  - id: AC-PI-001
    given: 目标目录无 .project-log
    when: 执行项目初始化
    then: 创建完整 .project-log 模板
    method: null
    evidence: null
    status: not-verified
  - id: AC-PI-002
    given: 目标目录已有 .project-log
    when: 再次执行项目初始化
    then: 跳过创建并报告 skipped，原内容不变
    method: null
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs: []
  decision_refs:
  - DEC-004
  implementation_refs:
  - skills/a-project-init/scripts/init_project_agents.py
  test_refs:
  - tests/test_project_init.py
  supersedes: []
  notes: 已被 BL-FRAMELAND-001 取代（2026-09-21 用户要求新框架彻底落地）：其“默认生成旧格式且不得改动 init_project.py”部分不再成立；其“初始化不覆盖已有 .project-log”的意图改由 BL-FRAMELAND-001 的 AC-FL-002 承载。
  created_at: '2026-08-15T10:20:00+08:00'
  updated_at: null
  last_verified_at: null

# --- 新框架彻底落地（BL-FRAMELAND，2026-09-21 用户确认）--- #
# 方向由用户明确确认（“要按新框架彻底落地，替换旧框架，不停留在 experimental”）。
# 以下 acceptance 是把已确认方向细化为可验证条目，作为任务拆解输入；实现前由 TASK-034
# 冻结契约，未冻结前不得当作最终语义，也不得据此宣称行为已实现。

- id: BL-FRAMELAND-001
  title: 新项目初始化默认生成新格式工程记录
  kind: rule
  domain: framework-landing
  status: active
  priority: critical
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-09-21 用户要求“新框架彻底落地”“不再使用老版本格式”
  description: 新框架（format 2）不再停留在实验阶段；对一个尚无可识别 .project-log 的目录初始化时，默认产物必须是新格式，而不是复制旧格式模板。
  actors:
  - user
  - agent
  trigger: 用户要求初始化项目，或执行统一初始化入口
  preconditions:
  - 目标项目根目录已确认
  - 目标目录尚无可识别的 .project-log
  inputs:
  - 目标项目根目录
  rule:
    statement: 无 .project-log 的项目初始化默认生成 format 2 状态标记及其运行时结构，不需要 --experimental 之类的实验开关；旧格式不再是默认产物。
  outputs:
  - 新格式状态标记与对应运行时结构
  side_effects: []
  exceptions:
  - 目标目录已有 format 1 或 format 2 记录时不覆盖，分别进入兼容或迁移路径
  failure_handling:
  - 前置条件（如 Git 工作树）不满足时 fail-closed 并报告原因，不得静默回落到旧格式
  invariants:
  - 默认初始化不会同时产出 format 1 与 format 2 两套结构化状态
  acceptance:
  - id: AC-FL-001
    given: 一个无 .project-log 的目录
    when: 执行默认项目初始化
    then: 生成 format 2 状态且无需实验开关，不生成旧格式结构化状态文件
    method: null
    evidence: null
    status: not-verified
  - id: AC-FL-002
    given: 目标目录已有可识别的 .project-log
    when: 重复执行初始化
    then: 不覆盖既有记录，报告 skipped 且保持幂等
    method: null
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs:
  - REQ-001
  decision_refs:
  - DEC-009
  implementation_refs:
  - runtime/scripts/init_project.py
  - runtime/scripts/vibe.py
  test_refs: []
  supersedes:
  - BL-PROJECTINIT-001
  notes: 取代 BL-PROJECTINIT-001 的默认格式与“不得改动初始化链路”约束；该原子“不覆盖已有内容”的意图由 AC-FL-002 保留。
  created_at: '2026-09-21T05:30:00Z'
  updated_at: null
  last_verified_at: null

- id: BL-FRAMELAND-002
  title: 新格式是唯一结构化事实源且旧格式写入 fail-closed
  kind: data-contract
  domain: framework-landing
  status: active
  priority: critical
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-09-21 用户要求彻底替换旧框架
  description: format 2 项目中，结构化状态只能由新格式写入路径产生；旧格式文件不得被继续写入，避免出现第二份互相矛盾的事实源。
  actors:
  - agent
  - runtime
  trigger: 任一写入状态、任务、目标、证据或阻塞的入口被调用
  preconditions:
  - 项目已声明 format 2
  inputs:
  - 写入请求
  rule:
    statement: format 2 项目只允许新格式写入路径修改结构化状态；旧格式写入入口必须明确拒绝并给出新入口指引，不得静默写旧文件或双写。
  outputs:
  - 单一结构化事实源
  side_effects: []
  exceptions:
  - 读取与只读展示仍可同时支持新旧格式，用于迁移对比与审计
  failure_handling:
  - 命中旧写入入口时以可读错误结束，说明应使用的新命令
  invariants:
  - 同一项目任一时刻只有一个结构化事实源
  - 不因兼容旧入口而回写旧 YAML
  acceptance:
  - id: AC-FL-003
    given: 一个 format 2 项目
    when: 调用旧格式写入入口尝试修改任务或目标
    then: 操作被拒绝并提示新格式入口，旧文件字节不变
    method: null
    evidence: null
    status: not-verified
  - id: AC-FL-004
    given: 一个 format 2 项目
    when: 通过新格式入口完成一次状态变更
    then: 只有新格式存储被写入，旧格式文件不出现该事实
    method: null
    evidence: null
    status: not-verified
  dependencies: []
  baseline_refs:
  - REQ-001
  decision_refs:
  - DEC-009
  implementation_refs:
  - runtime/scripts/state_context.py
  - runtime/scripts/loopctl.py
  test_refs: []
  supersedes: []
  notes: null
  created_at: '2026-09-21T05:30:00Z'
  updated_at: null
  last_verified_at: null

- id: BL-FRAMELAND-003
  title: 结构化状态覆盖完整生命周期实体与关系
  kind: data-contract
  domain: framework-landing
  status: active
  priority: high
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-09-21 用户要求新框架彻底落地（整体改造方案已获认可）
  description: 新格式必须能承载完整生命周期：Goal、Task、Run、Blocker、Evidence、Review、业务原子、需求基线、决策、架构、研究、对齐、复盘与蒸馏，并表达它们之间的引用关系。
  actors:
  - agent
  trigger: 任一生命周期产物需要被记录、查询或引用
  preconditions:
  - 项目已声明 format 2
  inputs:
  - 各生命周期产物
  rule:
    statement: 完整生命周期的实体与关系可由新格式记录并跨引用；不得因为缺少实体而把状态回落到旧 YAML 或自由文本。
  outputs:
  - 可查询、可交叉引用的生命周期状态
  side_effects: []
  exceptions:
  - 面向人的长正文仍以 Git/Markdown 保存，结构化存储保留引用与版本
  failure_handling:
  - 未支持的实体类型必须显式报错，不得静默降级为自由文本
  invariants:
  - 实体 ID 与引用在导入导出后保持稳定
  acceptance:
  - id: AC-FL-005
    given: 一个 format 2 项目
    when: 记录业务原子、需求、决策、证据与复核结果
    then: 各实体可写入、可查询且引用可校验，无需旧 YAML 参与
    method: null
    evidence: null
    status: not-verified
  - id: AC-FL-006
    given: 一个 format 2 项目
    when: 请求记录尚未支持的实体类型
    then: 明确报错并指出缺失能力，不写入自由文本兜底
    method: null
    evidence: null
    status: not-verified
  dependencies:
  - BL-FRAMELAND-002
  baseline_refs:
  - REQ-001
  decision_refs:
  - DEC-009
  implementation_refs:
  - runtime/scripts/state_store.py
  test_refs: []
  supersedes: []
  notes: null
  created_at: '2026-09-21T05:30:00Z'
  updated_at: null
  last_verified_at: null

- id: BL-FRAMELAND-004
  title: 任务与目标完成由绑定证据和独立复核门禁裁决
  kind: constraint
  domain: framework-landing
  status: active
  priority: critical
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-09-21 用户要求彻底落地，并要求按框架既有验证纪律交付
  description: 新格式把“已完成”作为需要证据支撑的裁决结果，而不是写入方能自行声明的状态。
  actors:
  - agent
  - runtime
  trigger: 声明任务完成、目标完成或发布结果时
  preconditions:
  - 项目已声明 format 2
  inputs:
  - 任务/目标的完成请求及其证据引用
  rule:
    statement: 任务与目标不得在缺少绑定证据时被标记完成；高风险或严格等级任务还需要独立复核结论，未满足时保持未完成并说明缺哪一项。
  outputs:
  - 带证据引用的完成裁决
  side_effects: []
  exceptions:
  - 明确记录为 not-applicable 的检查项不阻塞完成，但必须说明理由
  failure_handling:
  - 证据缺失、失效或绑定到旧版本时拒绝完成并给出精确原因
  invariants:
  - 覆盖产物变化后，原证据转为失效而不是继续背书
  acceptance:
  - id: AC-FL-007
    given: 一个任务声明完成但没有有效证据
    when: 执行完成判定
    then: 判定不通过并列明缺失的证据或复核
    method: null
    evidence: null
    status: not-verified
  - id: AC-FL-008
    given: 任务覆盖的产物在验证后发生变化
    when: 再次判断任务是否完成
    then: 旧证据失效，任务回到未完成状态直到重新验证
    method: null
    evidence: null
    status: not-verified
  dependencies:
  - BL-FRAMELAND-003
  baseline_refs:
  - REQ-001
  decision_refs:
  - DEC-009
  implementation_refs:
  - runtime/scripts/state_gate.py
  - runtime/scripts/state_evidence.py
  test_refs: []
  supersedes: []
  notes: null
  created_at: '2026-09-21T05:30:00Z'
  updated_at: null
  last_verified_at: null

- id: BL-FRAMELAND-005
  title: 旧格式迁移显式、无损、可回退、可续跑
  kind: flow
  domain: framework-landing
  status: active
  priority: critical
  risk: critical
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-09-21 用户确认整体改造方案（旧格式兼容与迁移路径包含在方案内）
  description: 存量旧格式项目需要通过一条显式、可审计的迁移路径进入新格式；迁移不得丢失历史，也不得把新写入回滚掉。
  actors:
  - user
  - agent
  - runtime
  trigger: 用户对某个旧格式项目显式发起迁移
  preconditions:
  - 目标项目已确认
  - 已产出迁移预览与备份
  inputs:
  - 旧格式项目记录
  rule:
    statement: 迁移先预览、再备份、再生成、再校验、最后原子切换；中断可续跑，失败可回退，且回退不得丢失迁移后的新写入。
  outputs:
  - 迁移后的新格式项目记录
  - 可复现的预览、备份与回退产物
  side_effects:
  - 目标项目记录在切换点被替换为新格式
  exceptions:
  - 预览发现冲突、缺引用或不可映射历史时停止切换并保留原状
  failure_handling:
  - 任一阶段失败都保留原记录与已生成产物，报告精确恢复步骤
  invariants:
  - 不静默迁移：没有显式授权不发生写入
  - 不删除历史证据，无法映射的历史进入显式保留区
  acceptance:
  - id: AC-FL-009
    given: 一个旧格式项目且用户未发起迁移
    when: 执行常规命令
    then: 项目记录字节不变，不产生新格式结构
    method: null
    evidence: null
    status: not-verified
  - id: AC-FL-010
    given: 用户显式发起迁移且预览无阻塞
    when: 执行迁移
    then: 生成新格式记录且旧记录可完整找回；中途中断后可续跑或回退
    method: null
    evidence: null
    status: not-verified
  - id: AC-FL-011
    given: 迁移后项目已有新写入
    when: 执行回退
    then: 回退保留新写入内容，不静默丢弃迁移后的数据
    method: null
    evidence: null
    status: not-verified
  dependencies:
  - BL-FRAMELAND-003
  baseline_refs:
  - REQ-001
  decision_refs:
  - DEC-009
  implementation_refs:
  - runtime/scripts/state_migrate.py
  test_refs: []
  supersedes: []
  notes: null
  created_at: '2026-09-21T05:30:00Z'
  updated_at: null
  last_verified_at: null

- id: BL-FRAMELAND-006
  title: 旧格式进入只读兼容并沿可审计路线淘汰
  kind: rule
  domain: framework-landing
  status: active
  priority: high
  risk: high
  authority: user-confirmed
  source:
    type: user-statement
    reference: 2026-09-21 用户要求“老版本后面肯定就要慢慢淘汰了”
  description: 旧格式在迁移期保留只读兼容能力，但不再作为可增长的目标格式；其退役时间线与最终停止支持必须有明确、可审计的关口。
  actors:
  - user
  - agent
