- id: DEC-008
  title: 显式配置的解释器只原地修复，改选环境需显式 opt-in
  category: tooling
  status: active
  authority: C
  user_approval: approved
  related_tasks:
  - TASK-030
  related_business_logic:
  - BL-WFOPT-002
  context: 复核 O016-01 发现安装/更新期的引导脚本在显式配置的解释器依赖检查失败时会改用命名 Conda 环境并重写
    CODEX_HOME/vibe-python，属于“静默替换用户显式选择”。日常运行入口（vibe.ps1/vibe.sh）与 global_installer.py
    都不这样做：前者 fail-closed 且从不创建环境，后者的文档声明该文件不被安装器管理。因此这是三处策略不一致，
    而且当 VIBE_PYTHON 环境变量被设置时，写入的配置文件实际不生效。
  hypothesis: 让引导脚本与另外两条链路一致（配置的解释器只原地修复，改选环境需显式授权），可以在不降低可恢复性的前提下消除静默替换。
  options:
  - name: 保持自动改选（现状）
    benefits:
    - 安装/更新对坏环境自愈
    costs:
    - 用户显式指定的解释器可能在不知情时被换掉
    risks:
    - 与另外两条链路的 fail-closed 策略不一致；VIBE_PYTHON 优先时写入的文件不生效
  - name: 原地修复 + 显式 opt-in（选择）
    benefits:
    - 用户指定的解释器永不被静默替换
    - 三条链路策略一致
    costs:
    - 环境无法原地修复时需要用户按提示处理或显式授权
    risks:
    - 需要新增一个开关与相应回归测试
  - name: 完全只读（失败即报错，无开关）
    benefits:
    - 行为最保守
    costs:
    - 正常的“请帮我换到 Conda 环境”诉求无法通过安装器完成
    risks:
    - 用户需要手工编辑配置文件
  decision: 引导脚本默认原地修复显式配置的解释器：若它是 Python 3.11+ 且只缺 Vibe 依赖，则把依赖装进该解释器并保持
    vibe-python 不变；若不是 3.11+ 或不可执行，则报错并给出修复命令。只有显式 opt-in（VIBE_PYTHON_REPAIR=1
    或 --repair-interpreter）才允许改选命名 Conda 环境并重写配置；VIBE_PYTHON 环境变量优先时拒绝重写配置文件。
  reason_summary:
  - 用户明确选择“原地修复、绝不静默换环境”（Q-001 答复 A）
  - 与日常入口和 global_installer 的 fail-closed 策略对齐
  - 顺带消除 VIBE_PYTHON 优先时写入文件不生效的隐患
  conditions:
  - 无显式配置时的首次安装行为不变（创建/修复命名 Conda 环境并写入配置）
  - uninstall（--no-create）不做任何安装或写入
  - 不改动 install/update 脚本的参数解析
  action: 修改 scripts/bootstrap_vibe_python.py（configured_python 返回来源、新增 python_version_ok、ensure_python
    分支与 --repair-interpreter/VIBE_PYTHON_REPAIR），并新增 4 项回归测试。
  expected_result: 显式配置的解释器不再被静默替换；坏环境有明确可执行的下一步。
  reversal_plan: 回滚 scripts/bootstrap_vibe_python.py 与 tests/test_installer.py；opt-in 开关随之失效，行为回到“自动改选”。
  observation: Windows 55 项（54 通过 + 1 跳过）与 Ubuntu 14 项检查全部通过（冻结修订 exports/task030-fix3，
    摘要 33765c8d…）；反证在最初修订上 5/5 失败、在上一修订上 2 项失败，证明两次修复都 load-bearing。独立复核
    reviewer-031 的 A1–A7 全部 verified，并提出 F1（VIBE_PYTHON_REPAIR=0 仍会 opt-in）与 F2（配置路径缺失时
    报错缺少出路提示）两处缺陷，均已修复并重新复验。
  actual_result: implemented and verified in source repo (frozen revision exports/task030-fix3)
  outcome_status: successful
  lesson: 安装器的“自愈”必须与用户显式配置的优先级对齐；对用户显式选择的环境，默认应是修复它而不是替换它。
  evidence:
  - PYTHONREPAIR-030
  - PLATFORM-030
  supersedes: []
  created_at: '2026-09-21T09:35:00+08:00'
  updated_at: '2026-09-21T10:50:00+08:00'
