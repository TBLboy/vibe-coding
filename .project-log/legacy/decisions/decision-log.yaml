  action: 记录根因分析到项目日志；向用户输出结论与防复发选项；待用户选择后实施。
  expected_result: 明确 MCP/hooks/插件失效的根因与可选防复发路径；热切换后 Vibe 配置保留且安装器 update 不再报错或误删用户配置。
